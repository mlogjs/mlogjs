name: npm-publish
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    environment:
      name: compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@v6

      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C compiler exec tsc -p test/tsconfig.json #typecheck tests
      - run: pnpm -C compiler coverage
      - run: npm publish
        working-directory: ./compiler
